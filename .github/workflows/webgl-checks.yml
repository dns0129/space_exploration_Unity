name: Verify WebGL preparation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  loading-and-packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix tools/WebChecks
      - run: npx --prefix tools/WebChecks playwright install --with-deps chromium
      - run: node --test tools/WebChecks/*.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webgl-loading-page-${{ github.sha }}
          path: test-results/pages/
